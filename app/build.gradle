// google-services.json is git-ignored (like key.properties), so a fresh clone without it must
// still build — it just builds without crash reporting.
def firebaseConfigFile = file("google-services.json")
if (firebaseConfigFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = 'com.kotlin.voice'
    compileSdk = 37

    defaultConfig {
        applicationId "com.kotlin.voice"
        minSdk = 27
        targetSdk = 36
        versionCode = 5
        versionName = "5.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Signing credentials are loaded from key.properties (git-ignored, not committed).
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                // storeFile in key.properties is repo-root-relative, so resolve from the root project.
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
